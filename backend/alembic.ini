# Alembic 配置文件
[alembic]
# 脚本目录
script_location = migrations

# 数据库连接URL（SQLite - 容器环境优化）
sqlalchemy.url = sqlite:////home/node/.openclaw/workspace/fishfarm-system/backend/fishfarm.db

# 迁移文件命名格式
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 版本路径
version_locations = migrations/versions

# 是否在终端显示SQL
sqlalchemy.echo = false

# 时区
time_zone =
