name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
    
    - name: 读取当前版本
      id: version
      run: |
        source VERSION
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "FULL_VERSION=v${VERSION}" >> $GITHUB_OUTPUT
        echo "📌 当前版本: v${VERSION}"
    
    - name: 递增版本号
      id: increment_version
      run: |
        source VERSION
        OLD_BUILD=$BUILD_NUMBER
        BUILD_NUMBER=$((OLD_BUILD + 1))
        VERSION="${VERSION_NAME}+${BUILD_NUMBER}"
        
        # 写入VERSION文件（使用printf避免heredoc问题）
        printf '# 渔场系统版本管理\n' > VERSION
        printf '# 格式: VERSION_NAME+BUILD_NUMBER\n' >> VERSION
        printf '# 示例: 1.0.2+3\n\n' >> VERSION
        printf '# 主版本号.次版本号.修订号\n' >> VERSION
        printf 'VERSION_NAME=%s\n' "$VERSION_NAME" >> VERSION
        printf '# 构建号 (每次构建递增)\n' >> VERSION
        printf 'BUILD_NUMBER=%s\n' "$BUILD_NUMBER" >> VERSION
        printf '# 完整版本字符串\n' >> VERSION
        printf 'VERSION=%s\n' "$VERSION" >> VERSION
        printf '# APK版本 (Android显示用，通常是 VERSION_NAME)\n' >> VERSION
        printf 'APK_VERSION=%s\n' "$VERSION_NAME" >> VERSION
        printf '# APK构建号 (Android显示用，通常是 BUILD_NUMBER)\n' >> VERSION
        printf 'APK_BUILD=%s\n' "$BUILD_NUMBER" >> VERSION
        
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ 版本号已更新: v${VERSION}"
        cat VERSION
    
    - name: 提交版本更新
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add VERSION
        git commit -m "chore: 递增版本号到 v${{ steps.increment_version.outputs.VERSION }}"
    
    - name: 设置Flutter环境
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
    
    - name: 安装依赖
      run: |
        cd app
        flutter pub get
    
    - name: 构建APK（Release版）
      run: |
        cd app
        flutter build apk --release
    
    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: fishfarm-app-release-v${{ steps.increment_version.outputs.VERSION }}
        path: app/build/app/outputs/flutter-apk/app-release.apk
    
    - name: 推送版本更新
      run: |
        git push origin main
    
    - name: 构建完成通知
      run: |
        echo "========================================"
        echo "✅ APK构建完成！"
        echo "📦 版本: v${{ steps.increment_version.outputs.VERSION }}"
        echo "📥 下载: 在Actions页面下载 artifact"
        echo "========================================"
